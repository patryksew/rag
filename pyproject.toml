[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "bm25s>=0.3.10",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "fire>=0.7.1",
    "langchain-text-splitters>=1.1.2",
    "mypy>=2.3.1",
    "ollama>=0.6.2",
    "pydantic>=2.13.4",
    "tqdm>=4.66.5",
    "uvicorn>=0.52.3",
]

[project.optional-dependencies]
embeddings = [
    "torch",
    "torchvision>=0.15.0",
    "accelerate",
    "sentence-transformers>=6.0.0",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/rocm7.2"

[tool.mypy]
exclude = [
    '^data/',
    '^\.venv/',
]
cache_dir = "~/goinfre/.cache/mypy"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.2.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["data", ".venv", "stuff"]

